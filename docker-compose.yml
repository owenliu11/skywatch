services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: skywatch
      POSTGRES_PASSWORD: skywatch
      POSTGRES_DB: skywatch
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skywatch -d skywatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET}
      DATABASE_URL: postgresql://skywatch:skywatch@db:5432/skywatch
      REDIS_URL: redis://redis:6379/0
      DAILY_CREDIT_BUDGET: 4000
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:


  