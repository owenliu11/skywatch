name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: skywatch
          POSTGRES_PASSWORD: skywatch
          POSTGRES_DB: skywatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skywatch -d skywatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://skywatch:skywatch@localhost:5432/skywatch
      REDIS_URL: redis://localhost:6379/0
      DAILY_CREDIT_BUDGET: 4000
      OPENSKY_CLIENT_ID: ""
      OPENSKY_CLIENT_SECRET: ""
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        working-directory: backend
        run: pytest -v

      - name: Mypy
        working-directory: backend
        continue-on-error: true
        run: mypy app